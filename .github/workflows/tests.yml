# T084: run the test suite on both platforms, and both gate. Windows
# reported without gating while its baseline had known failures (T081/T056);
# that baseline has been honestly green since 2026-09-01 (quickstart-results,
# #168), and a red run that reports as a pass is how a real failure hides —
# the wake-adapter EBUSY (#214) was exactly that shape: invisible to CI, red
# on the one machine that could see it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The repo has had eslint and an `npm run lint` script all along, and CI
  # never ran either. A lint error sat on main unnoticed as a result (#210).
  # One platform is enough for a static check, and it gates: a lint error is
  # not a platform difference, so there is nothing here to report-but-allow.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
